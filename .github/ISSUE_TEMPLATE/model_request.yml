name: Model request
description: Ask for a speech model to be added to the catalog
title: "model: "
labels: ["model"]
body:
  - type: markdown
    attributes:
      value: |
        Models must be in a format sherpa-onnx can run (transducer, Whisper, Moonshine or SenseVoice).
        You can also add one yourself: see "Adding a model to the catalog" in CONTRIBUTING.md.
  - type: input
    id: repo
    attributes:
      label: Hugging Face repository URL
      placeholder: https://huggingface.co/csukuangfj/...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine kind
      options:
        - Transducer (Parakeet, Zipformer)
        - Whisper
        - Moonshine
        - SenseVoice
        - Not sure
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Languages
      placeholder: "e.g. English, German"
  - type: textarea
    id: why
    attributes:
      label: Why add it?
      description: Accuracy, speed, size, language coverage, license.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Model license
      placeholder: "e.g. CC-BY-4.0, MIT"
