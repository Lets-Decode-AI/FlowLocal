[package]
name = "flowlocal"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowlocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
cpal = "0.18.2"
rubato = "5.0.1"
rdev = "0.5.3"
enigo = "0.6.1"
sha2 = "0.11.1"
hex = "0.4.3"
keyring = "4.2.0"
sysinfo = "0.39.6"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries", "static"] }
arboard = { version = "3.7.0", features = ["image-data"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
tokio-util = "0.7.20"
fs4 = "1.1.0"
futures-util = "0.3.34"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
